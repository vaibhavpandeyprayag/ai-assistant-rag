[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m \"not slow\""
markers = [
    "slow: tests that download models or run long jobs (deselect with '-m \"not slow\"')",
    "requires_model: tests requiring locally available model weights",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
